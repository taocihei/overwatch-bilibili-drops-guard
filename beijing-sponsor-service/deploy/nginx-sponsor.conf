# Place the limit_req_zone directive inside nginx.conf's http {} block.
limit_req_zone $binary_remote_addr zone=sponsor_orders:10m rate=5r/s;

upstream beijing_sponsor_service {
    server 127.0.0.1:8765;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 8k;

    location = /api/sponsor/callback {
        proxy_pass http://beijing_sponsor_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location /api/sponsor/ {
        limit_req zone=sponsor_orders burst=15 nodelay;
        proxy_pass http://beijing_sponsor_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
    }

    location = /api/health {
        proxy_pass http://beijing_sponsor_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
    }
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
